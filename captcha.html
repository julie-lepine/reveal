<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0D0F1E"/>
  <title>REVEAL — Vérification</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0A0F1C;
      color: #EEF1FF;
      font-family: Inter, system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      box-sizing: border-box;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #A8B0C7; font-size: 0.95rem; text-align: center; line-height: 1.45; }
    #widget { min-height: 70px; }
    .status { margin-top: 16px; font-size: 0.9rem; color: #A8B0C7; text-align: center; }
    .status.is-ok { color: #34d399; }
    .status.is-err { color: #F87171; }
  </style>
</head>
<body>
  <h1>Vérification anti-robot</h1>
  <p>Coche la case pour continuer.</p>
  <div id="widget"></div>
  <p class="status" id="status">Chargement…</p>
  <script type="module">
    import { TURNSTILE_SITE_KEY } from "./js/config/turnstile.js";
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./js/config/supabase.js";
    import { createClient } from "./js/vendor/supabase-js.js";

    const params = new URLSearchParams(window.location.search);
    const sid = String(params.get("sid") || "").trim();
    const statusEl = document.getElementById("status");
    const widgetEl = document.getElementById("widget");

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " is-" + kind : "");
    }

    function loadTurnstile() {
      return new Promise((resolve, reject) => {
        if (window.turnstile) {
          resolve();
          return;
        }
        const script = document.createElement("script");
        script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
        script.async = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("script"));
        document.head.appendChild(script);
      });
    }

    async function sendToken(token) {
      if (!sid) return;
      const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      });
      const channel = client.channel("captcha-handoff-" + sid, {
        config: { broadcast: { ack: true } },
      });
      await new Promise((resolve, reject) => {
        const t = window.setTimeout(() => reject(new Error("subscribe")), 8000);
        channel.subscribe((status) => {
          if (status === "SUBSCRIBED") {
            window.clearTimeout(t);
            resolve();
          }
          if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
            window.clearTimeout(t);
            reject(new Error(status));
          }
        });
      });
      const sent = await channel.send({
        type: "broadcast",
        event: "token",
        payload: { token },
      });
      try {
        await client.removeChannel(channel);
      } catch {
        /* ignore */
      }
      if (sent !== "ok") throw new Error("broadcast");
    }

    function notifyHost(token) {
      try {
        window.mobileApp?.postMessage?.({ detail: { token } });
      } catch {
        /* pas dans la WebView in-app */
      }
      window.setTimeout(() => {
        try {
          window.mobileApp?.close?.();
        } catch {
          /* ignore */
        }
      }, 150);
    }

    async function onSolved(token) {
      setStatus("Vérification OK…");
      try {
        await sendToken(token);
      } catch {
        /* postMessage suffit dans l’app ; Realtime est un secours */
      }
      notifyHost(token);
      setStatus("C’est bon.", "ok");
    }

    if (!sid) {
      setStatus("Lien invalide. Ferme cette fenêtre et réessaie depuis l’app.", "err");
    } else {
      try {
        await loadTurnstile();
        window.turnstile.render(widgetEl, {
          sitekey: TURNSTILE_SITE_KEY,
          theme: "dark",
          size: "flexible",
          appearance: "always",
          language: "fr",
          callback: onSolved,
          "error-callback": () => setStatus("Échec du défi. Réessaie.", "err"),
          "expired-callback": () => setStatus("Expiré. Recommence le défi.", "err"),
        });
        setStatus("Coche la case ci-dessus.");
      } catch {
        setStatus("Impossible de charger la vérification.", "err");
      }
    }
  </script>
</body>
</html>
