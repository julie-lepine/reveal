<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0D0F1C"/>
  <title>REVEAL — Vérification</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0A0F1C;
      color: #EEF1FF;
      font-family: system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      box-sizing: border-box;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #A8B0C7; font-size: 0.95rem; text-align: center; line-height: 1.45; }
    #widget { min-height: 70px; width: min(100%, 320px); }
    .status { margin-top: 16px; font-size: 0.9rem; color: #A8B0C7; text-align: center; }
    .status.is-ok { color: #34d399; }
    .status.is-err { color: #F87171; }
  </style>
</head>
<body>
  <h1>Vérification anti-robot</h1>
  <p>Coche la case pour continuer.</p>
  <div id="widget"></div>
  <p class="status" id="status">Chargement…</p>
  <script>
    (function () {
      var FALLBACK_SITE_KEY = "0x4AAAAAADX_7XllBAkmx7Xg";
      var SUPABASE_URL = "https://ojzxbvpdfnwagrvbhfll.supabase.co";
      var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qenhidnBkZm53YWdydmJoZmxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDU2OTUsImV4cCI6MjA5NDc4MTY5NX0.kUkNxsYhnZPJ7ffelarYRL9AhJdv5mh8jEZRBl7xMyw";
      var APP_RETURN = "com.reveal.partygames://captcha";
      var params = new URLSearchParams(window.location.search);
      var siteKey = String(params.get("sitekey") || FALLBACK_SITE_KEY).trim();
      var sid = String(params.get("sid") || "").trim();
      var statusEl = document.getElementById("status");
      var widgetEl = document.getElementById("widget");

      function setStatus(text, kind) {
        statusEl.textContent = text;
        statusEl.className = "status" + (kind ? " is-" + kind : "");
      }

      function broadcastToken(token) {
        if (!sid || !token) return;
        try {
          fetch(SUPABASE_URL + "/realtime/v1/api/broadcast", {
            method: "POST",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: "Bearer " + SUPABASE_ANON_KEY,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              messages: [{
                topic: "captcha-handoff-" + sid,
                event: "token",
                payload: { token: token }
              }]
            })
          }).catch(function () { /* ignore */ });
        } catch (e) { /* ignore */ }
      }

      function notifyHost(token) {
        var payload = JSON.stringify({ token: token });
        try {
          if (window.mobileApp && window.mobileApp.postMessage) {
            window.mobileApp.postMessage(payload);
          }
        } catch (e) { /* ignore */ }
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(payload, window.location.origin);
          }
        } catch (e2) { /* ignore */ }
        broadcastToken(token);
        window.setTimeout(function () {
          try {
            if (window.mobileApp && window.mobileApp.close) window.mobileApp.close();
          } catch (err) { /* ignore */ }
          try {
            window.location.href = APP_RETURN + "?token=" + encodeURIComponent(token);
          } catch (err2) { /* ignore */ }
        }, 250);
      }

      function onSolved(token) {
        setStatus("C’est bon. Retour à REVEAL…", "ok");
        notifyHost(token);
      }

      function renderWidget() {
        if (!window.turnstile || !window.turnstile.render) {
          setStatus("Impossible de charger la vérification.", "err");
          return;
        }
        window.turnstile.render(widgetEl, {
          sitekey: siteKey,
          theme: "dark",
          size: "flexible",
          appearance: "always",
          retry: "auto",
          language: "fr",
          callback: onSolved,
          "error-callback": function () { setStatus("Échec du défi. Réessaie.", "err"); },
          "expired-callback": function () { setStatus("Expiré. Recommence le défi.", "err"); }
        });
        setStatus("Coche la case ci-dessus.");
      }

      if (!siteKey || /YOUR_TURNSTILE/i.test(siteKey)) {
        setStatus("Clé de vérification manquante.", "err");
        return;
      }

      if (window.turnstile) {
        renderWidget();
        return;
      }

      var timedOut = false;
      var timer = window.setTimeout(function () {
        timedOut = true;
        setStatus("Chargement trop long. Ferme et réessaie.", "err");
      }, 12000);

      var script = document.createElement("script");
      script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
      script.async = true;
      script.onload = function () {
        if (timedOut) return;
        window.clearTimeout(timer);
        renderWidget();
      };
      script.onerror = function () {
        if (timedOut) return;
        window.clearTimeout(timer);
        setStatus("Impossible de charger Cloudflare. Vérifie ta connexion.", "err");
      };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
